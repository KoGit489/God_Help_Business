services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_PERSISTENCE: database
      STORAGE_BACKEND: s3
      UPLOAD_DIR: /tmp/god-help-uploads
      PUBLIC_SHARE_BASE_URL: https://${APP_DOMAIN}/share.html
      AUTH_REQUIRED: "true"
      ALLOW_ACCOUNT_REGISTRATION: "false"
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-26214400}
      MAX_FLOOR_PLAN_UPLOAD_BYTES: ${MAX_FLOOR_PLAN_UPLOAD_BYTES:-104857600}
      MAX_NATIVE_UPLOAD_BYTES: ${MAX_NATIVE_UPLOAD_BYTES:-2147483648}
      SEED_DEMO_DATA: "false"
      MEDIA_WORKER_SOCKET: /run/media-worker/worker.sock
    volumes:
      - media_socket:/run/media-worker:ro
    depends_on:
      media-worker:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  media-socket-init:
    image: god-help-media-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    network_mode: none
    read_only: true
    volumes:
      - media_socket:/run/media-worker
    command: ["python", "-c", "import os; os.chown('/run/media-worker', 65532, 65532); os.chmod('/run/media-worker', 0o770)"]
    restart: "no"

  media-worker:
    image: god-help-media-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "65532:65532"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 64
    tmpfs:
      - /tmp:size=3g,mode=1777
    volumes:
      - media_socket:/run/media-worker
    environment:
      MEDIA_WORKER_SOCKET: /run/media-worker/worker.sock
      CAPTURE_PROCESSOR: ${CAPTURE_PROCESSOR:-manual}
    command: ["python", "-m", "app.media_worker"]
    restart: unless-stopped
    depends_on:
      media-socket-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  media_socket:
