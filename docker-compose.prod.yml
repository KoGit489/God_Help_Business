services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_PERSISTENCE: database
      STORAGE_BACKEND: s3
      UPLOAD_DIR: /tmp/god-help-uploads
      PUBLIC_SHARE_BASE_URL: https://${APP_DOMAIN}/share.html
      AUTH_REQUIRED: "true"
      ALLOW_ACCOUNT_REGISTRATION: "false"
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-26214400}
      MAX_FLOOR_PLAN_UPLOAD_BYTES: ${MAX_FLOOR_PLAN_UPLOAD_BYTES:-104857600}
      MAX_NATIVE_UPLOAD_BYTES: ${MAX_NATIVE_UPLOAD_BYTES:-2147483648}
      SEED_DEMO_DATA: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
