name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Check Python dependencies
        run: |
          python -m pip check
          pip-audit -r requirements.txt
      - name: Run application tests
        run: |
          python -m pytest -q
          node --test tests/*.cjs
      - name: Install verified secret scanner
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan tracked history and source
        run: |
          /tmp/gitleaks git --log-opts='--all' --redact=100 --no-banner .
          for folder in app frontend deploy docs tests; do
            /tmp/gitleaks dir --redact=100 --no-banner "$folder"
          done