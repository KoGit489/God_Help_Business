<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>God_Help_Business MVP</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; background: #f7f9fc; color: #111827; }
      .card { border: 1px solid #d0d7de; border-radius: 12px; padding: 1.25rem; max-width: 780px; background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
      form { display: grid; gap: 0.75rem; margin-top: 1rem; }
      input, button { padding: 0.7rem; font-size: 1rem; border-radius: 6px; border: 1px solid #cbd5e1; }
      button { background: #2563eb; color: white; cursor: pointer; }
      button.secondary { background: #0f766e; }
      code { background: #f6f8fa; padding: 0.2rem 0.4rem; border-radius: 4px; }
      ul { padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>God_Help_Business MVP</h1>
      <p>This starter page now acts as a lightweight Phase 1 dashboard for projects and pin capture.</p>

      <h2>Current user</h2>
      <p><strong id="user-name">Loading...</strong><br /><span id="user-email"></span></p>

      <h2>Create project</h2>
      <form id="project-form">
        <input id="title" placeholder="Project title" required />
        <input id="description" placeholder="Short description" />
        <button type="submit">Create project</button>
      </form>

      <button id="sample-pin" class="secondary" style="margin-top: 1rem;">Add demo pin to first project</button>

      <h2>Projects</h2>
      <ul id="project-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
