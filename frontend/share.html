<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared Review</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%); color: #0f172a; }
      .card { max-width: 760px; margin: 0 auto; padding: 1.25rem; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
      .pill { display: inline-block; padding: 0.35rem 0.6rem; border-radius: 999px; background: #ecfeff; color: #0f766e; font-size: 0.9rem; }
      .panel { margin-top: 1rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 12px; background: #fcfdff; }
      .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.7rem; margin-top: 1rem; }
      .summary-box { padding: 0.75rem; border-radius: 10px; border: 1px solid #dbeafe; background: #f8fbff; }
      button { width: 100%; margin-top: 0.8rem; padding: 0.75rem; border: 0; border-radius: 10px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
      ul { padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pill">Shared project review</div>
      <h1 id="title">Loading shared project...</h1>
      <p id="description" class="muted"></p>
      <div class="summary-grid">
        <div class="summary-box"><strong id="status-pill">Status</strong><br /><span id="project-status">Loading...</span></div>
        <div class="summary-box"><strong>Captures</strong><br /><span id="capture-count">0</span></div>
        <div class="summary-box"><strong>Heading</strong><br /><span id="heading-summary">—</span></div>
      </div>
      <div class="panel">
        <h2>Captured evidence</h2>
        <ul id="pins"></ul>
      </div>
      <button id="copy-link-btn" type="button">Copy review link</button>
    </div>
    <script>
      function buildApiBases() {
        const params = new URLSearchParams(window.location.search);
        const override = params.get('apiBase');
        if (override) {
          return [override.replace(/\/$/, '')];
        }

        if (window.location.protocol === 'file:') {
          return ['http://127.0.0.1:8000'];
        }

        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocalhost) {
          return ['http://127.0.0.1:8000'];
        }

        const sameOrigin = window.location.origin.replace(/\/$/, '');
        const wifiBackend = `${window.location.protocol}//${window.location.hostname}:8000`;
        const candidates = window.location.port === '5500'
          ? [wifiBackend, sameOrigin, '/api']
          : [sameOrigin, '/api'];

        return [...new Set(candidates)];
      }

      const apiBases = buildApiBases();

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || window.location.pathname.split('/').pop();

      async function apiRequest(path) {
        let lastError = null;

        for (const base of apiBases) {
          try {
            const response = await fetch(`${base}${path}`);
            const payload = await response.json().catch(() => null);
            if (response.ok) {
              return payload;
            }

            const apiMessage = payload?.error?.message || `Request failed with status ${response.status}`;
            if (response.status === 404 && base !== apiBases[apiBases.length - 1]) {
              lastError = new Error(apiMessage);
              continue;
            }
            throw new Error(apiMessage);
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error('Unable to reach the API service.');
      }

      async function loadSharedProject() {
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        const pins = document.getElementById('pins');
        const statusBox = document.getElementById('project-status');
        const captureCount = document.getElementById('capture-count');
        const headingSummary = document.getElementById('heading-summary');

        if (!token) {
          title.textContent = 'This review link is missing a token.';
          description.textContent = 'Please check the shared URL.';
          return;
        }

        title.textContent = 'Loading shared project...';
        description.textContent = '';
        pins.innerHTML = '<li>Loading captured evidence...</li>';

        try {
          const payload = await apiRequest(`/share/${token}`);

          title.textContent = payload.title;
          description.textContent = payload.description || 'No description provided.';
          statusBox.textContent = payload.status || 'draft';
          captureCount.textContent = String(payload.pins.length || 0);
          headingSummary.textContent = payload.pins.length ? `${payload.pins[0].heading || 0}°` : '—';

          if (!payload.pins.length) {
            pins.innerHTML = '<li>No evidence has been captured for this project yet.</li>';
            return;
          }
          pins.innerHTML = payload.pins
            .map((pin) => 
              `<li><strong>${pin.captured_on}</strong> — heading ${pin.heading || 0}° · ${pin.latitude}, ${pin.longitude} · ${pin.photo_key || pin.native_file_key || 'no media file'}</li>`
            )
            .join('');
        } catch (error) {
          const unavailable = /not found|404|invalid share token|share link/i.test(error.message || '');
          title.textContent = unavailable ? 'This review link is not available.' : 'Unable to load shared project.';
          description.textContent = unavailable ? 'The shared link is invalid or expired.' : error.message;
          pins.innerHTML = '<li>No evidence available.</li>';
        }
      }

      document.getElementById('copy-link-btn').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          document.getElementById('title').textContent = 'Review link copied';
        } catch (error) {
          document.getElementById('title').textContent = 'Review link ready';
        }
      });

      loadSharedProject();
    </script>
  </body>
</html>
